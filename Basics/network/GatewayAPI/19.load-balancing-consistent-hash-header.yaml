---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: headers-policy
spec:
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Headers
      headers:
        - name: x-user-id
  
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: headers-route
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headers-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: envoy-gateway-system
  hostnames:
    - "eg-example.tluapitest.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          port: 80
